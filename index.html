<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Intuition</title>
<meta name="description" content="Personal English dictionary and recall trainer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Intuition">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF0EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1412" media="(prefers-color-scheme: dark)">
<style>
@font-face{font-family:'Charis SIL';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/charis-sil-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Charis SIL';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/charis-sil-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Charis SIL';font-style:italic;font-weight:400;font-display:swap;src:url(fonts/charis-sil-latin-400-italic.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Charis SIL';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/charis-sil-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7,U+02C9-02CB,U+02CE-02CF,U+02D1-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Charis SIL';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/charis-sil-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7,U+02C9-02CB,U+02CE-02CF,U+02D1-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Charis SIL';font-style:italic;font-weight:400;font-display:swap;src:url(fonts/charis-sil-latin-ext-400-italic.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7,U+02C9-02CB,U+02CE-02CF,U+02D1-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/instrument-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/instrument-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/instrument-sans-latin-600-normal.woff2) format('woff2')}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: a pocket dictionary — one column of ruled index cards, headwords set like a printed entry, tab bar under the thumb. */
:root{
  --bg:#EDF0EB; --surface:#FAFBF9; --ink:#17201C; --muted:#5A675F; --line:#D3DAD3;
  --accent:#1E5A48; --accent-ink:#FFFFFF; --accent-soft:#DCE8E1; --stress:#B0601A;
  --good:#2C7547; --good-soft:#DCEEE1; --warn:#9A620F; --warn-soft:#F4E7CC; --bad:#AE3737; --bad-soft:#F5DDDA;
  --f-head:"Charis SIL","Charis","Georgia","Noto Serif",serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --nav-h:62px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#17201C; --ink:#E3EAE5; --muted:#93A29A; --line:#2A3530;
  --accent:#6BC2A3; --accent-ink:#0C1A14; --accent-soft:#1D372E; --stress:#E7A262;
  --good:#71CB90; --good-soft:#1B3224; --warn:#E2B45E; --warn-soft:#382C16; --bad:#F08B81; --bad-soft:#3B201F;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#17201C; --ink:#E3EAE5; --muted:#93A29A; --line:#2A3530;
  --accent:#6BC2A3; --accent-ink:#0C1A14; --accent-soft:#1D372E; --stress:#E7A262;
  --good:#71CB90; --good-soft:#1B3224; --warn:#E2B45E; --warn-soft:#382C16; --bad:#F08B81; --bad-soft:#3B201F;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:12px;min-height:56px}
.brand{font-family:var(--f-head);font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-family:var(--f-ui);font-weight:500;font-size:12px;color:var(--muted);margin-left:6px;letter-spacing:.02em}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.iconbtn.spin svg{animation:none;opacity:.5}}
main .wrap{padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.label{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
h2.sec{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
p{margin:0}
.serif{font-family:var(--f-head)}
.note{font-size:13.5px;color:var(--muted)}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;font-size:14px;color:var(--muted)}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted);padding:0 8px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=search],textarea,select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px}
textarea{resize:vertical;min-height:84px;line-height:1.45}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600;color:var(--muted)}
label.f .hint{font-weight:400;font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.new{background:var(--accent-soft);color:var(--accent)}
.chip.due{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* library */
.capture{display:flex;gap:8px}
.capture input{flex:1;min-width:0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;text-decoration:none;color:inherit}
.item:first-child{border-top:0}
.irow{display:flex;align-items:center;border-top:1px solid var(--line)}
.irow:first-child{border-top:0}
.irow .item{flex:1;min-width:0;border-top:0}
.isp{flex:none;padding-right:12px}
.item .body{flex:1;min-width:0}
.item .hw{font-family:var(--f-head);font-size:19px;font-weight:700;line-height:1.25}
.item .pos{font-family:var(--f-head);font-style:italic;font-weight:400;color:var(--muted);font-size:15px;margin-left:6px}
.item .ipa{font-family:var(--f-head);color:var(--muted);font-size:14.5px}
.item .gist{font-size:14.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}

/* entry */
.entry-head{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.entry-head .hw{font-family:var(--f-head);font-size:34px;font-weight:700;line-height:1.1;letter-spacing:-.01em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.entry-head .pos{font-family:var(--f-head);font-style:italic;color:var(--muted);font-size:18px}
.ipa-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-head);font-size:19px}
.ipa-line .tag{font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.st1{color:var(--stress);font-weight:700}
.st2{color:var(--muted)}
.speak{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--accent)}
.speak svg{width:18px;height:18px}
.index-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative}
.index-card::before{content:"";position:absolute;left:0;right:0;top:40px;height:2px;background:var(--stress);opacity:.55}
.index-card .label{height:28px;display:flex;align-items:center}
.index-card .meaning{font-family:var(--f-head);font-size:21px;line-height:1.5;margin-top:14px;text-wrap:pretty}
.scene{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);background:var(--surface);position:relative}
.scene .txt{font-family:var(--f-head);font-style:italic;font-size:17px;line-height:1.55}
.reveal{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;background:transparent;width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14.5px}
.reveal b{color:var(--ink);font-weight:600}
.zh{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);font-size:17px}
.block{border-top:1px solid var(--line);padding-top:14px}
.ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ex li{display:flex;gap:10px;align-items:flex-start}
.ex .mk{flex:none;width:22px;height:22px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:2px}
.ex .mk.y{background:var(--good-soft);color:var(--good)}
.ex .mk.n{background:var(--bad-soft);color:var(--bad)}
.ex .t{font-family:var(--f-head);font-size:17px;line-height:1.45}
.ex .why{font-size:14px;color:var(--muted);margin-top:2px}
.ex .x{min-width:0;flex:1}
.nu{display:grid;grid-template-columns:minmax(90px,30%) 1fr;gap:8px 14px;margin:0}
.nu dt{font-family:var(--f-head);font-weight:700;font-size:16.5px}
.nu dd{margin:0;font-size:15px;min-width:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.fam{border-collapse:collapse;width:100%;font-size:15px}
table.fam th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line)}
table.fam td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
table.fam tr:first-child td{border-top:0}
table.fam .fm{font-family:var(--f-head);font-weight:700;font-size:16.5px;white-space:nowrap}
table.fam .ip{font-family:var(--f-head);white-space:nowrap}
table.fam tr.absent td{color:var(--muted)}
.gram{display:flex;flex-direction:column;gap:12px}
.gram ul{margin:4px 0 0;padding-left:18px}
.gram li{font-family:var(--f-head);font-size:16.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.sent{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.sent .t{font-family:var(--f-head);font-size:17px}
.fb{font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.fb .better{font-family:var(--f-head);font-size:16.5px;background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.cautions{background:var(--warn-soft);border-radius:var(--r);padding:10px 14px;font-size:14px}
.cautions ul{margin:4px 0 0;padding-left:18px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);border-radius:10px;padding:10px 12px;font-size:14.5px}

.checkcard{background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;font-size:15.5px}
/* edit */
details.grp{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.grp>summary{list-style:none;cursor:pointer;padding:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"+";font-size:20px;color:var(--muted);line-height:1}
details.grp[open]>summary::after{content:"–"}
details.grp .in{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.sticky-save{position:sticky;bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;gap:8px;background:var(--bg);padding:8px 0;border-top:1px solid var(--line)}
.sticky-save .btn{flex:1}
.thinking{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--muted)}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:999px;background:var(--accent);animation:b 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}

/* practise */
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.pcard .q{font-family:var(--f-head);font-size:20px;line-height:1.4;text-wrap:pretty}
.pcard .kind{display:flex;justify-content:space-between;align-items:center;gap:8px}
.progress{height:4px;border-radius:999px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:15.5px;line-height:1.4}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .why{display:block;font-size:13.5px;color:var(--muted);margin-top:4px}
.opt:disabled{cursor:default;color:var(--ink)}
.verdict{border-radius:10px;padding:10px 12px;font-size:15px}
.verdict.y{background:var(--good-soft)}
.verdict.n{background:var(--bad-soft)}
.verdict.m{background:var(--warn-soft)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{min-height:58px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;font-size:14.5px}
.rate button small{font-weight:400;color:var(--muted);font-size:12px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:24px;font-variant-numeric:tabular-nums;font-family:var(--f-head)}
.stat span{font-size:12.5px;color:var(--muted)}
.blank{display:inline-block;min-width:4em;border-bottom:2px solid var(--stress);color:transparent}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.02em;position:relative}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs a[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--accent);border-radius:0 0 2px 2px}
nav.tabs .badge{position:absolute;top:8px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--stress);color:#fff;font-size:10.5px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14.5px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.18)}
</style>
</head>

<header class="top"><div class="wrap">

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o||{}));
const DAY = 86400000;
const arr = a => Array.isArray(a)?a:[];
function slug(w){ return String(w||"").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80); }
function ipaHTML(s){ return esc(s).replace(/ˈ/g,'<span class="st1" title="primary stress">ˈ</span>').replace(/ˌ/g,'<span class="st2" title="secondary stress">ˌ</span>'); }
function startOfDay(t){ const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
function rel(t){ if(!t) return ""; const d=Math.round((startOfDay(t)-startOfDay(Date.now()))/DAY); if(d===0) return "today"; if(d===1) return "tomorrow"; if(d===-1) return "yesterday"; return d>0?`in ${d} days`:`${-d} days ago`; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function reEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function lines(s){ return String(s||"").split("\n").map(x=>x.trim()).filter(Boolean); }
function parts(l){ return l.split("|").map(x=>x.trim()); }

const ICON_SPEAK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

/* ---------- storage: IndexedDB on this phone ---------- */
S.outbox={};
function pendingCount(){ return 0; }

let dbp=null;
function idb(){
  if(dbp) return dbp;
  dbp=new Promise((res,rej)=>{ const r=indexedDB.open("english-intuition",1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore("words",{keyPath:"id"}); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });

}
async function idbTx(mode, fn){
  const db=await idb();
  return new Promise((res,rej)=>{ const tx=db.transaction("words",mode); const req=fn(tx.objectStore("words")); let out;
    if(req) req.onsuccess=()=>{ out=req.result; };
    tx.oncomplete=()=>res(out); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); });
}
const idbAll=()=>idbTx("readonly", st=>st.getAll());
const idbPut=e=>idbTx("readwrite", st=>st.put(e));
const idbDel=id=>idbTx("readwrite", st=>st.delete(id));

function saveTomb(){ try{ localStorage.setItem(TOMB_KEY, JSON.stringify(S.tomb)); }catch{} }

window.addEventListener("online", ()=>{ retryLookups(true); softRender(true); });

/* ---------- review logic ---------- */
function isDue(e){ const r=e.review||{}; return !e.captured && (!r.next || r.next<=Date.now()); }
function isNew(e){ return !(e.review&&e.review.last); }
function statusChip(e){
  if(e.captured) return S.busy.draft&&S.busy.draft[e.id] ? '<span class="chip new">Saving…</span>' : '<span class="chip plain">Not built</span>';
  const r=e.review||{};
  if(!r.last) return '<span class="chip new">New</span>';
  if(isDue(e)) return '<span class="chip due">Due</span>';
  if((r.confidence??2)<=0) return '<span class="chip bad">Shaky</span>';
  return `<span class="chip ok">${esc(rel(r.next))}</span>`;
}
function priority(e){ const r=e.review||{}; return (arr(r.missed).length*2 + (r.lapses||0)*3 + (r.last?0:1) + (3-(r.confidence??2))); }
function dueList(){ return [...S.entries.values()].filter(isDue).sort((a,b)=>priority(b)-priority(a) || (a.review?.next||0)-(b.review?.next||0)); }
function schedule(e, rating, missedNotes){
  const r = Object.assign({interval:0, lapses:0, history:[], missed:[]}, e.review||{});
  const prev = r.interval||0; let iv;
  if(rating===0){ iv=0; r.lapses=(r.lapses||0)+1; }
  else if(rating===1) iv = Math.max(1, Math.round(prev*1.2));
  else if(rating===2) iv = prev ? Math.max(2, Math.round(prev*2.2)) : 1;
  else iv = prev ? Math.max(4, Math.round(prev*3)) : 3;
  r.interval=iv; r.last=Date.now(); r.confidence=rating;
  r.next = rating===0 ? Date.now() : startOfDay(Date.now())+iv*DAY;
  r.history = arr(r.history).concat([{at:Date.now(), r:rating}]).slice(-30);
  if(missedNotes && missedNotes.length) r.missed = arr(r.missed).concat(missedNotes).slice(-10);
  else if(rating>=2 && arr(r.missed).length) r.missed = arr(r.missed).slice(1); // a clean round retires the oldest miss
  e.review = r; return e;
}
function refreshBadge(){ const n=dueList().length; const b=$("#dueBadge"); if(!b) return; b.hidden=!n; b.textContent=n>99?"99+":String(n); }

/* ---------- word forms ---------- */
function forms(e){
  const out=new Set([e.word]);
  arr(e.family).forEach(f=>{ if(f.form && f.status!=="none" && f.form!=="—") out.add(f.form); });
  arr(e.grammar&&e.grammar.inflections).forEach(i=>String(i.form||"").split(/[,/;]/).forEach(x=>{ x=x.replace(/\(.*?\)/g,"").trim(); if(x && x.split(" ").length<=3 && /^[a-z' -]+$/i.test(x)) out.add(x); }));
  return [...out].filter(Boolean).sort((a,b)=>b.length-a.length);
}
function formRegex(e){ return new RegExp("\\b("+forms(e).map(reEsc).join("|")+")\\b","i"); }
function mask(text, e){ return esc(text).replace(new RegExp("\\b("+forms(e).map(f=>reEsc(esc(f))).join("|")+")\\b","gi"),'<span class="blank">____</span>'); }
function norm(s){ return String(s||"").toLowerCase().replace(/[’']/g,"'").replace(/[^a-z' -]/g,"").replace(/\s+/g," ").trim(); }


/* ---------- GitHub sync: one backup file in your private repository ---------- */
const DEFAULT_SYNC={repo:"VickyWangWork/english-intuition-data", path:"backup.json", branch:"main", token:"", auto:true, lastSync:0};
function syncCfg(){ S.cfg.sync=Object.assign(clone(DEFAULT_SYNC), S.cfg.sync||{}); return S.cfg.sync; }
function syncReady(){ const c=syncCfg(); return !!(c.token && c.repo && c.path); }
function b64e(str){ const b=new TextEncoder().encode(str); let bin=""; for(let i=0;i<b.length;i+=0x8000) bin+=String.fromCharCode.apply(null, b.subarray(i,i+0x8000)); return btoa(bin); }
function b64d(str){ const bin=atob(String(str||"").replace(/\s/g,"")); const b=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return new TextDecoder().decode(b); }
function ghErr(status, body){
  let m=""; try{ m=JSON.parse(body).message||""; }catch{ m=String(body||"").slice(0,120); }
  if(status===401) return {code:"gh_auth", message:"GitHub didn't accept the token. Check it in More → Sync, or make a new one."};
  if(status===403) return {code:"gh_forbidden", message:"The token can't change this repository. Give it Contents: Read and write for "+syncCfg().repo+"."};
  if(status===404) return {code:"gh_missing", message:"Couldn't find "+syncCfg().repo+". Check the repository name, and that the token can see it."};
  return {code:"gh_error", message:"GitHub said: "+(m||("error "+status))};
}
function mergeData(localEntries, localTomb, remote){
  const tomb=Object.assign({}, remote&&remote.deleted||{});
  for(const id in localTomb) tomb[id]=Math.max(tomb[id]||0, localTomb[id]);
  const byId=new Map();
  for(const e of arr(remote&&remote.entries)) if(e&&e.id) byId.set(e.id, e);
  for(const e of localEntries){ const r=byId.get(e.id); if(!r || (e.updated||0)>=(r.updated||0)) byId.set(e.id, e); }
  for(const [id,e] of [...byId]) if(tomb[id] && tomb[id]>=(e.updated||0)) byId.delete(id);
  const entries=[...byId.values()].sort((a,b)=>String(a.id).localeCompare(String(b.id)));
  return {app:"english-intuition", version:2, entries, deleted:tomb};
}
let syncing=null;
async function ghSync(quiet){
  if(syncing) return syncing;
  syncing=(async()=>{
    const c=syncCfg();
    if(!syncReady()) throw {code:"no_sync", message:"Set up sync in More → Sync with GitHub first."};
    if(!navigator.onLine) throw {code:"offline", message:"You're offline. Sync when you're back online."};
    const url=`https://api.github.com/repos/${c.repo}/contents/${c.path.split("/").map(encodeURIComponent).join("/")}`;
    const H={"Authorization":"Bearer "+c.token, "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28"};
    for(let attempt=0; attempt<3; attempt++){
      let remote=null, sha=null, remoteText="";
      const r=await fetch(`${url}?ref=${encodeURIComponent(c.branch)}&_=${Date.now()}`, {headers:H, cache:"no-store"});
      if(r.status===200){
        const j=await r.json(); sha=j.sha;
        if(j.content) remoteText=b64d(j.content);
        else if(j.size>0){ const raw=await fetch(`${url}?ref=${encodeURIComponent(c.branch)}&_=${Date.now()}`, {headers:Object.assign({},H,{Accept:"application/vnd.github.raw"}), cache:"no-store"}); remoteText=await raw.text(); }
        try{ remote=remoteText?JSON.parse(remoteText):null; }catch{ throw {code:"gh_bad_file", message:"The backup file on GitHub isn't valid JSON. Fix or delete it, then sync again."}; }
      } else if(r.status!==404){ throw ghErr(r.status, await r.text()); }   // 404: no backup file yet, it will be created
      const merged=mergeData([...S.entries.values()], S.tomb, remote);
      // bring this phone up to date
      let pulled=0, removed=0;
      const keep=new Set(merged.entries.map(e=>e.id));
      for(const e of merged.entries){ const l=S.entries.get(e.id); if(!l || (l.updated||0)<(e.updated||0)){ S.entries.set(e.id, e); idbPut(e).catch(saveFail); pulled++; } }
      for(const id of [...S.entries.keys()]) if(!keep.has(id)){ S.entries.delete(id); idbDel(id).catch(()=>{}); removed++; }
      S.tomb=merged.deleted; saveTomb();
      // push if GitHub's copy differs
      const remoteNorm=remote?JSON.stringify(mergeData([], {}, remote)):"";
      const mergedText=JSON.stringify(merged);
      let pushed=false;
      if(mergedText!==remoteNorm){
        const body={message:`Sync from ${/iPhone|iPad/.test(navigator.userAgent)?"iPhone":"web app"} · ${merged.entries.length} words`, content:b64e(JSON.stringify(Object.assign({exported:new Date().toISOString()}, merged), null, 1)), branch:c.branch};
        if(sha) body.sha=sha;
        const w=await fetch(url, {method:"PUT", headers:Object.assign({},H,{"Content-Type":"application/json"}), body:JSON.stringify(body)});
        if(w.status===409 || w.status===422){ continue; }   // changed on GitHub meanwhile: pull again and retry
        if(!w.ok) throw ghErr(w.status, await w.text());
        pushed=true;
      }
      c.lastSync=Date.now(); saveCfg(); refreshBadge();
      return {pulled, removed, pushed, total:merged.entries.length};
    }
    throw {code:"gh_busy", message:"GitHub's copy kept changing. Try again in a moment."};
  })();
  try{ return await syncing; } finally{ syncing=null; }
}
async function runSync(quiet){
  const b=document.querySelector("[data-act='sync']"); if(b) b.classList.add("spin");
  try{
    const r=await ghSync(quiet);
    const bits=[]; if(r.pulled) bits.push(`${r.pulled} updated from GitHub`); if(r.removed) bits.push(`${r.removed} removed`); if(r.pushed) bits.push("saved to GitHub");
    if(!quiet || r.pulled || r.removed) toast(bits.length?`Synced: ${bits.join(", ")}.`:"Already in sync.");
    render();
  }catch(e){ if(!quiet || (e&&e.code!=="offline"&&e.code!=="no_sync")) toast((e&&e.message)||"Sync failed. Try again."); }
  finally{ const b2=document.querySelector("[data-act='sync']"); if(b2) b2.classList.remove("spin"); }
}
document.addEventListener("click", ev=>{ const b=ev.target.closest("[data-act='sync']"); if(b){ ev.preventDefault(); runSync(false); } });
function syncBtn(){ return syncReady()?`<button class="iconbtn" data-act="sync" aria-label="Sync with GitHub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/></svg></button>`:""; }

/* ---------- AI service, called with your own key ---------- */
const DEFAULT_CFG={v:2, provider:"gemini", keys:{gemini:"",claude:""}, geminiQuick:"gemini-flash-lite-latest", geminiFull:"gemini-flash-lite-latest", claudeQuick:"claude-haiku-5-5", claudeFull:"claude-haiku-5-5"};
const CFG_KEY="english-intuition.ai.v1";
function loadCfg(){
  let c={}; try{ c=JSON.parse(localStorage.getItem(CFG_KEY)||"{}")||{}; }catch{}
  const out=Object.assign(clone(DEFAULT_CFG), c); out.keys=Object.assign({gemini:"",claude:""}, c.keys||{});
  if(!c.v){ // settings saved before Flash-Lite became the default: move them over once
    if(out.geminiQuick==="gemini-flash-latest") out.geminiQuick=DEFAULT_CFG.geminiQuick;
    if(out.geminiFull==="gemini-flash-latest") out.geminiFull=DEFAULT_CFG.geminiFull;
    out.v=2; try{ localStorage.setItem(CFG_KEY, JSON.stringify(out)); }catch{}
  }
  return out;
}
function saveCfg(){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(S.cfg)); }catch{ toast("Couldn't save settings on this phone."); } }
function makeAI(){ const c=S.cfg; if(!c || !c.keys[c.provider]) return null; return { json:(prompt,opts)=>aiJSON(prompt,opts||{}) }; }
function httpErr(status, msg){
  const m=String(msg||"").slice(0,160);
  if(status===401||status===403) return {code:"bad_key",message:m};
  if(status===429) return {code:"rate_limited",message:m};
  if(status===400||status===404) return {code:/api key/i.test(m)?"bad_key":"bad_request",message:m};
  return {code:"upstream_error",message:m};
}
function parseJSONLoose(t){
  t=String(t||"").trim(); if(!t) throw {code:"invalid_json"};
  try{ return JSON.parse(t); }catch{}
  const m=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(m){ try{ return JSON.parse(m[1]); }catch{} }
  const a=t.search(/[\[{]/), b=Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));

function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;

  return prev[n];
}

  if(!S.pack) return []; const n=String(word||"").trim().toLowerCase(); if(n.length<4) return [];
  const out=[]; for(const w in S.pack){ if(Math.abs(w.length-n.length)>2) continue; const d=lev(n,w); if(d>0&&d<=2) out.push([d,w]); }

  const id=slug(word); if(!id){ toast("Type a word in English letters."); return; }

  if(!opts.skipForm){ const fam=findForm(word); if(fam){ S.check={word, context, status:"form", entry:fam.id}; render(); return; } }
  if(packGet(word)) opts.skipSpell=true; // a known word: no need to check spelling
  else if(!opts.skipSpell && (!navigator.onLine || !S.sample)){
    const near=packNear(word);
    if(near.length){ S.check={word, context, status:"suggest", offline:true, suggestions:near.map(x=>({word:x[0], hint:x[1][2]})), near:nearWords(word).map(e=>e.id)}; render(); return; }
  }
  if(!navigator.onLine){ S.check=null; saveNew(word, id, context); return; }
  let pre=null;
  if(S.sample && !opts.skipSpell){
    const token={}; S.check={word, context, status:"checking", token}; render();
    pre=startCore(word, context);
    let res=null;
    try{ res=await S.sample.json(checkPrompt(word),{modelTier:"quick"}); }catch(err){ sampleErr(err); }
    if(!S.check || S.check.token!==token){ pre.ctl.abort(); return; }
    if(res && res.valid===false){
      pre.ctl.abort();
      const seen=new Set();
      const sug=arr(res.suggestions).map(s=>({word:String(s&&s.word||"").trim(), hint:String(s&&s.hint||"").trim()})).filter(s=>{ const k=slug(s.word); if(!k||seen.has(k)||k===id) return false; seen.add(k); return true; }).slice(0,5);
      const near=nearWords(word).filter(e=>!seen.has(e.id)).map(e=>e.id);
      S.check={word, context, status:"suggest", suggestions:sug, near}; render(); return;
    }
  }
  S.check=null; saveNew(word, id, context, pre);
}
function saveNew(word, id, context, pre){
  if(S.entries.has(id)){ if(pre) pre.ctl.abort(); toast(`“${word}” is already in your dictionary`); go("w-"+id); return; }
  if(route().v==="add"){ S.editFor=null; S.edit=null; }
  const pk=packGet(word);
  if(pk){
    if(pre) pre.ctl.abort();
    const base=normaliseDraft({word, pos:pk[0], ipa:pk[1], meaning:pk[2]}, word);
    put(Object.assign({id, created:Date.now(), personal:[], review:{}, context:context||"", partial:true, pendingCore:true, fromPack:true}, base));
    const live=!!(S.sample && navigator.onLine);
    go("w-"+id); toast(`Saved “${word}” from the offline pack.${live?" Adding examples…":""}`);
    if(live) fillCore(id);
    return;
  }
  const offline=!navigator.onLine;
  put({id, word, context:context||"", captured:true, pendingLookup:true, created:Date.now(), personal:[], review:{}, tags:[]});
  if(offline){ if(pre) pre.ctl.abort(); toast(`Saved “${word}”. It will be looked up when you're back online.`); go("w-"+id); }
  else if(S.sample){ go("w-"+id); backgroundDraft(id, word, context||"", pre); } else { if(pre) pre.ctl.abort(); toast(`Saved “${word}”. Add a free AI key in More to fill entries in automatically.`); go("w-"+id); }
}

function corePrompt(word, context){
  return `Write the first part of a personal dictionary entry for an adult English learner living in the UK (first language Chinese) who wants to understand English directly, without translating.
Word or phrase: "${word}"${context?`\nWhere she met it: "${context}"`:""}
- "meaning": at most 2 short plain-English sentences, the way a thoughtful friend would explain it; accurate, not dictionary wording, and no example inside it.
- If "Where she met it" is given, the meaning, scene and every example must use that sense of the word.
- "simulation": a vivid, realistic 2-3 sentence everyday scene in second person that lets her feel the concept, without using the word. Vary the setting (work, home, friends, news, travel); don't default to London or the Tube.
- "examples": two natural sentences using the word, in clearly different contexts.
- "nonExamples": one nearby situation the word does NOT describe, with why.
- "ipa": British IPA in slashes with ˈ before the stressed syllable; "ipaUS" only if American differs materially, else "".
- "frequency": everyday | somewhat formal | uncommon. "chinese": the precise simplified-Chinese equivalent for this sense (check ranks, technical and legal terms carefully).
- If the word looks misspelt, put the likely intended word in "word".
British spelling. Reply with only JSON:
{"word":"","pos":"","ipa":"","ipaUS":"","meaning":"","simulation":"","examples":["",""],"nonExamples":[{"text":"","why":""}],"frequency":"","chinese":""}`;
}
function restPrompt(e){
  return `Complete a personal dictionary entry for an adult English learner (first language Chinese) who wants to understand English directly.
Word: "${e.word}" (${e.pos||"part of speech not given"})
Meaning already written: ${e.meaning}
Scene already written: ${e.simulation||""}

Rules:
- Stay with the sense in the meaning above throughout. Write every IPA inside slashes.
- "nuance": 2-4 near-neighbours or confusable ideas and how each differs from this meaning.
- "register": register and emotional shade in one or two sentences.
- "family": only genuinely attested noun / adjective / verb / adverb forms, each with British IPA (ˈ before the stressed syllable). status is common, uncommon or rare; for a missing part of speech add a row with form "—", status "none" and a note. Never invent forms.
- "grammar.inflections": past tense and past participle ONLY if the headword is a verb (or name the auxiliary clearly, e.g. felt ambivalent). Plural or "uncountable" for nouns; comparatives for gradable adjectives.
- "frequencyNote": a short caution that the frequency label is approximate.
- "pronNote": a British–American difference or tricky sound, else "".
- "recall.recognise": 4 options, exactly one correct, distractors drawn from the near-neighbours, shuffled, each with a short why.
- "recall.contrast": three scenarios without the word, at least one that fits and one that doesn't.
- "recall.produce": asks her to name or use the word for a described situation, without revealing it. "recall.explain": "Explain ${e.word} in your own English words."
- "cautions": anything uncertain, or []. "tags": 1-3 short lowercase topic tags.
British spelling. Reply with only JSON:
{"nuance":[{"term":"","diff":""}],"register":"","family":[{"form":"","pos":"","ipa":"","status":"","note":""}],"grammar":{"patterns":[""],"collocations":[""],"inflections":[{"label":"","form":""}]},"frequencyNote":"","pronNote":"","recall":{"recognise":{"question":"Which situation shows ${e.word}?","options":[{"text":"","correct":true,"why":""}]},"contrast":[{"scenario":"","fits":true,"why":""}],"produce":"","explain":""},"cautions":[],"tags":[]}`;
}
function startCore(word, context){
  const ctl=new AbortController();
  const promise=S.sample.json(corePrompt(word, context),{modelTier:"quick", signal:ctl.signal, cache:false});
  promise.catch(()=>{});
  return {ctl, promise};
}
async function backgroundDraft(id, word, context, pre){
  S.busy.draft=S.busy.draft||{}; S.busy.full=S.busy.full||{}; S.draftErr=S.draftErr||{};
  if(S.busy.draft[id]) return;
  S.busy.draft[id]=true; delete S.draftErr[id]; softRender(true);
  let core=null, fid=null;
  try{
    try{ core=normaliseDraft(await (pre?pre.promise:startCore(word, context).promise), word); }
    catch(err){ if(err && ["bad_key","bad_request","offline","rate_limited","cancelled"].includes(err.code)) throw err; core=null; }
    if(core && core.meaning) fid=commitDraft(id, core, true);
    else { const d=normaliseDraft(await S.sample.json(draftPrompt(word, context),{cache:false}), word); if(!d.meaning) throw {code:"invalid_json"}; fid=commitDraft(id, d, false); core=null; }
  }catch(err){
    const msg=sampleErr(err); S.draftErr[id]=msg||"Drafting stopped.";
    if(err && err.code==="refused"){ const c=S.entries.get(id); if(c){ const n=clone(c); delete n.pendingLookup; put(n); } }
  }
  delete S.busy.draft[id]; softRender(true);
  if(fid && core) fillRest(fid);
}
function retryLookups(fromOnline){
  if(!S.sample || !navigator.onLine) return;
  S.busy.draft=S.busy.draft||{}; S.busy.full=S.busy.full||{}; S.draftErr=S.draftErr||{};
  for(const e of [...S.entries.values()]){
    if(!fromOnline && S.draftErr[e.id]) continue;
    if(e.captured && e.pendingLookup && !S.busy.draft[e.id]) backgroundDraft(e.id, e.word, e.context||"");
    else if(e.pendingCore && !(S.busy.core&&S.busy.core[e.id])) fillCore(e.id);
    else if(e.partial && !e.pendingCore && !e.captured && !S.busy.full[e.id] && !S.busy.draft[e.id]) fillRest(e.id);
  }
}
function commitDraft(id, d, partial){
  const cur=S.entries.get(id); if(!cur || !cur.captured) return null;
  const entry=Object.assign(clone(cur), d, {aiDrafted:true}); delete entry.captured; delete entry.pendingLookup; delete entry.context;
  if(partial) entry.partial=true;
  const nid=slug(entry.word); let fid=id;
  if(nid && nid!==id && !S.entries.has(nid)){ entry.id=nid; fid=nid; put(entry); removeEntry(id); const r=route(); if(r.v==="word"&&r.id===id) location.replace("#w-"+nid); }
  else { entry.id=id; put(entry); }
  toast(`Saved “${entry.word}”.${partial?" Adding the rest…":" Tap the pencil to change anything."}`);
  return fid;
}
async function fillRest(id){
  S.busy.full[id]=true; softRender(true);
  try{
    const e=S.entries.get(id); if(!e) return;
    const r=normaliseDraft(await askJSON(restPrompt(e),{cache:false}), e.word);
    const cur=clone(S.entries.get(id)); if(!cur || !cur.id) return;
    const empty=(k,x)=> x==null || x==="" || (Array.isArray(x)&&!x.length) || (k==="grammar"&&!arr(x.patterns).length&&!arr(x.collocations).length&&!arr(x.inflections).length) || (k==="recall"&&!arr(x.recognise&&x.recognise.options).length&&!arr(x.contrast).length&&!x.produce);
    ["nuance","register","family","grammar","frequencyNote","pronNote","recall","cautions","tags"].forEach(k=>{ if(!empty(k,r[k]) && empty(k,cur[k])) cur[k]=r[k]; });
    delete cur.partial; put(cur);
  }catch(err){
    sampleErr(err);
    if(err && (err.code==="refused"||err.code==="invalid_json"||err.code==="bad_key")){ toast("Couldn't add the extra sections. Open Edit and tap Redraft to try again."); const cur=S.entries.get(id); if(cur){ const c=clone(cur); delete c.partial; put(c); } }
  }
  finally{ delete S.busy.full[id]; softRender(true); }
}

async function wordAct(ev, e){

    try{

  }
}

async function draft(existing){

function saveFromForm(existing, f, auto){

  if(!data.word){ toast("Type the word first"); return; }

function buildCards(e){
  const rc=e.recall||{}; const cards=[];
  const w2c=[]; if(arr(rc.recognise&&rc.recognise.options).length>=2) w2c.push("recognise");
  const contrastPool = arr(rc.contrast).length ? arr(rc.contrast) : arr(e.nonExamples).map(n=>({scenario:n.text,fits:false,why:n.why}));
  if(contrastPool.length) w2c.push("contrast");
  if(w2c.length){ const k=pick(w2c); cards.push(k==="contrast"?{k, item:pick(contrastPool)}:{k, opts:shuffle(rc.recognise.options)}); }
  const re=formRegex(e); const clozable=arr(e.examples).filter(t=>re.test(t));
  const c2w=["define"]; if(clozable.length) c2w.push("cloze");
  const k2=pick(c2w); cards.push(k2==="cloze"?{k:"cloze", text:pick(clozable)}:{k:"define"});
  cards.push({k: rc.produce && Math.random()<.6 ? "produce" : "explain"});
  cards.push({k:"rate"});
  return cards;
}

  $("#endSess").onclick=()=>{ S.sess=null; render(); };
  v.querySelectorAll("[data-act='speak']").forEach(b=>b.onclick=()=>speak(b.dataset.text));
  v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; ss.ans=i; const o=c.opts[i]; if(!o.correct) ss.miss.push(`chose “${o.text}”${o.why?" ("+o.why+")":""}`); render(); });
  v.querySelectorAll("[data-yn]").forEach(b=>b.onclick=()=>{ ss.ans = b.dataset.yn==="1"; if(ss.ans!==c.item.fits) ss.miss.push(`${c.item.fits?"missed that it fits":"thought it fit"}: “${c.item.scenario}”`); render(); });
  const tf=$("#typeForm"); if(tf){ const inp=$("#typeIn"); setTimeout(()=>{ try{inp.focus({preventScroll:true});}catch{} },50);
    tf.onsubmit=ev=>{ ev.preventDefault(); const val=inp.value; if(!val.trim()) return; const ok = forms(e).some(f=>norm(f)===norm(val)); ss.ans={ok,val}; if(!ok) ss.miss.push(`couldn't recall the word${c.k==="cloze"?" in context":" from its meaning"}`); render(); }; }
  const gu=$("#giveUp"); if(gu) gu.onclick=()=>{ ss.ans={ok:false,val:""}; ss.miss.push(`couldn't recall the word${c.k==="cloze"?" in context":" from its meaning"}`); render(); };
  const pi=$("#prodIn"); if(pi) pi.oninput=()=>{ ss.draft=pi.value; };
  const pc=$("#prodCheck"); if(pc) pc.onclick=async()=>{
    const text=$("#prodIn").value.trim(); if(!text){ toast("Write something first"); return; }
    ss.draft=text; S.busy.prod=true; render();
    try{
      if(c.k==="produce"){ const fb=await askFeedback(e,text,e.recall.produce); ss.fb={verdict:String(fb.verdict||""),naturalness:String(fb.naturalness||""),grammar:String(fb.grammar||""),nuance:String(fb.nuance||""),better:String(fb.better||"")};
        const n=clone(S.entries.get(e.id)); n.personal=arr(n.personal).concat([{text,at:Date.now(),feedback:ss.fb}]); put(n);
        if(fb.verdict==="needs work") ss.miss.push("sentence needed work"); }
      else { const fb=await askExplain(e,text); ss.fb={verdict:String(fb.verdict||""),feedback:String(fb.feedback||""),missed:String(fb.missed||"")}; if(ss.fb.missed) ss.miss.push(ss.fb.missed); }
      ss.ans=true;
    }catch(err){ const msg=sampleErr(err); if(msg) toast(msg); }
    S.busy.prod=false; render();
  };
  const ps=$("#prodSelf"); if(ps) ps.onclick=()=>{ const t=$("#prodIn").value.trim(); if(t && c.k==="produce"){ const n=clone(S.entries.get(e.id)); n.personal=arr(n.personal).concat([{text:t,at:Date.now()}]); put(n); } ss.ans=true; render(); };
  const sk=$("#prodSkip"); if(sk) sk.onclick=()=>nextCard();
  const nb=$("#nextCard"); if(nb) nb.onclick=()=>nextCard();
  v.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
    const rating=+b.dataset.r; const n=schedule(clone(S.entries.get(e.id)), rating, ss.miss); put(n);
    ss.done.push({id:e.id, word:e.word, r:rating});
    if(rating===0 && !ss.requeued){ ss.requeued={}; }
    if(rating===0 && ss.requeued && !ss.requeued[e.id]){ ss.requeued[e.id]=1; ss.ids.push(e.id); }
    ss.wi++; ss.ci=0; ss.ans=null; ss.miss=[]; ss.fb=null; ss.draft="";
    if(ss.wi<ss.ids.length){ const ne=S.entries.get(ss.ids[ss.wi]); if(ne) ss.cards=buildCards(ne); }
    render(); window.scrollTo(0,0);
  });
}
function ivPreview(e, r){ const t=schedule(clone(e), r, []); const d=t.review.interval; return d===1?"1 day":d+" days"; }
function nextCard(){ const ss=S.sess; ss.ci++; ss.ans=null; ss.fb=null; ss.draft=""; render(); window.scrollTo(0,0); }

/* --- Backup --- */
function renderBackup(v){
  setHead("Settings &amp; backup");
  const all=[...S.entries.values()];
  v.innerHTML=`<div class="stack">${notes()}
    <div class="banner">Your words are saved on this phone. Export a backup now and then to keep them safe or move them to another device.</div>
    <form class="stack" id="cfgForm" style="gap:10px" autocomplete="on"><h2 class="sec" style="margin:0">AI settings</h2>
      <p class="small">New words are written by an AI service using your own key. The key stays on this device and is never uploaded to GitHub. When you save, Safari or Chrome can offer to keep it in your password manager (iCloud Keychain or Google Password Manager), so your other devices fill it in with one tap.</p>
      <input type="text" name="username" autocomplete="username" value="${S.cfg.provider==="claude"?"Claude API key":"Gemini API key"}" hidden readonly>
      <label class="f">Service<select id="cfgProvider"><option value="gemini" ${S.cfg.provider==="gemini"?"selected":""}>Google Gemini (free tier)</option><option value="claude" ${S.cfg.provider==="claude"?"selected":""}>Claude (Anthropic API, paid)</option></select></label>
      <label class="f">API key<span class="hint">${S.cfg.provider==="claude"?'Create one at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>':'Get a free key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>'}</span>
        <input type="password" id="cfgKey" name="password" value="${esc(S.cfg.keys[S.cfg.provider]||"")}" autocomplete="current-password" autocapitalize="none" spellcheck="false" placeholder="Paste your key"></label>
      <details class="grp"><summary>Models</summary><div class="in">
        <label class="f">Fast model<span class="hint">Spelling check and first meaning</span><input type="text" id="cfgQuick" value="${esc(S.cfg.provider==="claude"?S.cfg.claudeQuick:S.cfg.geminiQuick)}" autocapitalize="none" spellcheck="false"></label>
        <label class="f">Full-entry model<span class="hint">Nuance, word family, practice questions, feedback</span><input type="text" id="cfgFull" value="${esc(S.cfg.provider==="claude"?S.cfg.claudeFull:S.cfg.geminiFull)}" autocapitalize="none" spellcheck="false"></label>
      </div></details>
      <div class="row"><button class="btn" type="submit" id="cfgSave">Save and test</button><span class="small" id="cfgMsg" role="status" style="flex:1;min-width:0"></span></div>
      ${S.cfg.provider==="gemini"?'<p class="note">Free-tier limits and terms are set by Google and can change.</p>':'<p class="note">Claude API use is billed to your Anthropic account, separately from a Claude plan.</p>'}
    </form>
    <form class="block stack" id="syForm" style="gap:10px" autocomplete="on"><h2 class="sec" style="margin:0">Sync with GitHub</h2>
      <p class="small">Keeps a backup file in your private GitHub repository. Sync merges both ways: for each word, the most recently changed copy wins, and deletions carry over.</p>
      <input type="text" name="username" autocomplete="username" value="GitHub sync token" hidden readonly>
      <label class="f">Repository<span class="hint">owner/name, ideally private</span><input type="text" id="syRepo" value="${esc(syncCfg().repo)}" autocapitalize="none" spellcheck="false"></label>
      <label class="f">Token<span class="hint">Fine-grained token with Contents: Read and write on that repository only. It stays on this device; when you save, Safari or Chrome can keep it in your password manager and fill it in on your other devices.</span><input type="password" id="syToken" name="password" value="${esc(syncCfg().token)}" autocomplete="current-password" autocapitalize="none" spellcheck="false" placeholder="github_pat_…"></label>
      <details class="grp"><summary>File and branch</summary><div class="in">
        <label class="f">File<input type="text" id="syPath" value="${esc(syncCfg().path)}" autocapitalize="none" spellcheck="false"></label>
        <label class="f">Branch<input type="text" id="syBranch" value="${esc(syncCfg().branch)}" autocapitalize="none" spellcheck="false"></label>
      </div></details>
      <label class="row small" style="gap:8px;font-weight:500"><input type="checkbox" id="syAuto" ${syncCfg().auto?"checked":""} style="width:20px;height:20px;min-height:0"> Sync when the app opens</label>
      <div class="row"><button class="btn" type="submit" id="sySave">Save and sync now</button><span class="small" id="syMsg" role="status" style="flex:1;min-width:0">${syncCfg().lastSync?"Last synced "+esc(rel(syncCfg().lastSync))+" at "+new Date(syncCfg().lastSync).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):""}</span></div>
    </form>
    <div class="block stack" style="gap:10px"><h2 class="sec" style="margin:0">Install on your iPhone</h2>
      <p class="small">Open this page in Safari, tap Share, then Add to Home Screen. Open it from the new icon: it runs full-screen and works offline.</p>
      <p class="small muted">Shortcuts and links open Safari rather than the Home Screen app, and the two keep separate words, so look words up from the app icon.</p>
    </div>
    <div class="block stack" style="gap:10px"><h2 class="sec" style="margin:0">Export</h2>
      <p class="small muted">${all.length} word${all.length===1?"":"s"}, with examples, your sentences and review history, as one JSON file.</p>
      <button class="btn block" id="expBtn" ${all.length?"":"disabled"}>Export backup</button>
      <div id="expFallback" hidden class="stack" style="gap:8px"><textarea id="expText" rows="6" readonly></textarea><button class="btn ghost" id="expCopy">Copy</button></div>
    </div>
    <div class="block stack" style="gap:10px"><h2 class="sec" style="margin:0">Import</h2>
      <p class="small muted">Words with the same headword are replaced by the imported version. To bring words over from the Claude version, export there and choose that file here.</p>
      <label class="btn ghost block" for="impFile" style="cursor:pointer">Choose a backup file</label>
      <input type="file" id="impFile" accept=".json,application/json" hidden>
      <textarea id="impText" rows="4" placeholder="…or paste backup JSON here" aria-label="Paste backup JSON"></textarea>
      <button class="btn ghost block" id="impBtn">Import pasted text</button>
      <p class="small" id="impMsg" role="status"></p>
    </div>
  </div>`;
  const payload=()=>JSON.stringify({app:"english-intuition", version:1, exported:new Date().toISOString(), entries:[...S.entries.values()]},null,2);
  $("#expBtn").onclick=async()=>{
    const data=payload(); const name=`english-intuition-${new Date().toISOString().slice(0,10)}.json`;
    try{ const file=new File([data], name, {type:"application/json"});
      if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"English Intuition backup"}); return; } }
    catch(err){ if(err && err.name==="AbortError") return; }
    try{ const url=URL.createObjectURL(new Blob([data],{type:"application/json"})); const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast("Backup saved"); return; }catch{}
    $("#expFallback").hidden=false; $("#expText").value=data; toast("Copy the text below to keep a backup");
  };
  $("#expCopy").onclick=()=>copyText($("#expText").value, $("#expText"));
  v.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{ const n=document.getElementById(b.dataset.copy); copyText(n.value, n); });
  const prov=$("#cfgProvider");
  const keepFields=()=>{ const c=S.cfg; c.keys[c.provider]=$("#cfgKey").value.trim();
    const q=$("#cfgQuick").value.trim(), fu=$("#cfgFull").value.trim();
    if(c.provider==="claude"){ c.claudeQuick=q||DEFAULT_CFG.claudeQuick; c.claudeFull=fu||DEFAULT_CFG.claudeFull; }
    else { c.geminiQuick=q||DEFAULT_CFG.geminiQuick; c.geminiFull=fu||DEFAULT_CFG.geminiFull; } };
  prov.onchange=()=>{ keepFields(); S.cfg.provider=prov.value; renderBackup(v); };
  $("#syForm").onsubmit=async(ev)=>{ ev.preventDefault();
    const c=syncCfg(); c.repo=$("#syRepo").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\/$/,""); c.token=$("#syToken").value.trim();
    c.path=$("#syPath").value.trim()||"backup.json"; c.branch=$("#syBranch").value.trim()||"main"; c.auto=$("#syAuto").checked; saveCfg();
    const msg=$("#syMsg"); if(!syncReady()){ msg.textContent="Saved. Add a token to turn on sync."; return; }
    msg.textContent="Syncing…";
    try{ const r=await ghSync(false); msg.textContent=`Synced ${r.total} word${r.total===1?"":"s"}.${r.pulled?` ${r.pulled} updated from GitHub.`:""}${r.pushed?" Saved to GitHub.":""}`; }
    catch(e){ msg.textContent=(e&&e.message)||"Sync failed."; }
  };
  $("#cfgForm").onsubmit=async(ev)=>{ ev.preventDefault();
    keepFields(); saveCfg(); S.sample=makeAI();
    const msg=$("#cfgMsg");
    if(!S.sample){ msg.textContent="Saved. Add a key to turn on AI look-ups."; return; }
    msg.textContent="Testing…";
    try{ const r=await S.sample.json('Reply with only this JSON: {"ok":true}',{modelTier:"quick"});
      msg.textContent = r&&r.ok ? "Working. New words will be filled in automatically." : "Saved, but the reply looked odd. Try a word.";
      retryLookups(true); }
    catch(e){ msg.textContent = sampleErr(e)||"Test stopped."; }
  };
  const doImport=(text)=>{
    let n=0; try{ const j=JSON.parse(text); const list=Array.isArray(j)?j:arr(j.entries);
      list.forEach(e=>{ if(e && e.word){ e.id=e.id||slug(e.word); if(e.id){ put(e); n++; } } });
      $("#impMsg").textContent = n?`Imported ${n} word${n===1?"":"s"}.`:"No words found in that file.";
    }catch{ $("#impMsg").textContent="That isn't a valid backup. Export one from this app and try again."; }
  };
  $("#impFile").onchange=ev=>{ const file=ev.target.files[0]; if(!file) return; const rd=new FileReader(); rd.onload=()=>doImport(String(rd.result)); rd.readAsText(file); };
  $("#impBtn").onclick=()=>{ const t=$("#impText").value.trim(); if(t) doImport(t); };
}

/* ---------- boot ---------- */
$("#backBtn").onclick=()=>{ const to=$("#backBtn").dataset.to; if(route().v==="edit"||route().v==="add") S.editFor=null; if(to) go(to); else history.back(); };
document.addEventListener("click", ev=>{
  const b=ev.target.closest("[data-act='filter'],[data-act='tag'],[data-act='addq']"); if(!b) return;
  if(b.dataset.act==="addq"){ S.q=""; capture(b.dataset.w); return; }
  if(b.dataset.act==="filter"){ S.filter=b.dataset.k; } else { S.tag = S.tag===b.dataset.t ? "" : b.dataset.t; }
  render();
});
document.addEventListener("click", ev=>{
  const sp=ev.target.closest(".isp [data-act='speak']"); if(sp){ ev.preventDefault(); speak(sp.dataset.text); }
});
document.addEventListener("click", ev=>{
  const b=ev.target.closest("[data-ck]"); if(!b || !S.check) return;
  const c=S.check, k=b.dataset.ck;
  if(k==="cancel"){ S.check=null; render(); return; }
  if(k==="open"){ S.check=null; go("w-"+b.dataset.id); return; }
  if(k==="asis"){ S.check=null; capture(c.word, c.context, {skipForm:true, skipSpell:true}); return; }
  if(k==="pick"){ const s=arr(c.suggestions)[+b.dataset.i]; S.check=null; if(s) capture(s.word, c.context, {skipSpell:true}); else render(); }
});
if(canSpeak){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch{} }
init();
})();
</script>
<script>
if("serviceWorker" in navigator){ window.addEventListener("load", ()=>{ navigator.serviceWorker.register("./sw.js").catch(()=>{}); }); }
</script>
</body>
